<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popote – Planifiez vos repas en groupe</title>
  <link rel="icon" href="google-consent-logo-120.png">
  <style>
    :root { color-scheme: light dark; --bg:#fbf7f1; --fg:#1d1b18; --muted:#6b655d; --accent:#b54a33; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --fg:#f1eee8; --muted:#a7acb5; --accent:#f2994a; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 20px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 34px; margin: 16px 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <img src="google-consent-logo-120.png" alt="Logo Popote">
  <h1>Popote</h1>
  <p>Planifiez vos repas de la semaine en groupe (famille, colocation, amis) et partagez une liste de courses générée automatiquement.</p>
  <p>La connexion se fait avec votre compte Google.</p>
  <p><a href="privacy-policy.html">Politique de confidentialité</a></p>
</main>
</body>
</html>
